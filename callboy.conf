[ollama]
# Base URL of the local Ollama server
url = http://localhost:11434
# Model name as shown in `ollama list`
model = qwen2.5:3b-instruct
# HTTP timeout in seconds
timeout_s = 60.0

[sdk2]
# Path to SDK2 example CLI binary that accepts flags like --network_interface=eth0 --set_velocity="..."
cli_path = /home/unitree/unitree_sdk2/build/bin/g1_loco_client
# Network interface used by Unitree SDK2 DDS (G1 usually eth0)
network_interface = eth0
# Per-command process timeout
timeout_s = 30.0
# Safety/testing: do not actually run SDK2 binary
# dry_run = true
# If true, wait for set_velocity duration before a following stop_move
wait_for_velocity_duration = true
