[ollama]
# Base URL of the local Ollama server
url = http://localhost:11434
# Model name as shown in `ollama list`
model = qwen2.5:3b-instruct

[sdk2]
# Path to SDK2 example CLI binary that accepts flags like --network_interface=eth0 --set_velocity="..."
cli_path = /home/unitree/unitree_sdk2/build/bin/g1_loco_client
# Network interface used by Unitree SDK2 DDS (G1 usually eth0)
network_interface = eth0
# Safety/testing: do not actually run SDK2 binary
dry_run = false

[riva]
# Riva gRPC server location
server = localhost:50051
# Language for ASR (de-DE, en-US, etc.)
language_code = de-DE
# Audio parameters
sample_rate_hz = 16000
channels = 1
# Show interim transcriptions in console?
interim_results = true
print_interim = true
# Add punctuation automatically?
enable_automatic_punctuation = true
# ROS topics
input_topic = /g1/mics/pcm16
output_topic = callboy/input_text
# ASR sensitivity (RMS threshold). Lower is more sensitive.
vad_threshold = 0.02
# Only process commands following this word (case-insensitive)
wakeword = Robert
# Show volume levels in console every 2 seconds for debugging
log_rms = false

[whisper]
# turbu, small
model_size = turbo
device = cuda
compute_type = int8_float16
# "de", "en", "None" for auto-detect
language = de
input_topic = /g1/mics/pcm16
output_topic = callboy/input_text
silence_duration = 0.6
min_speech_duration = 0.3
# Enable 'log_rms' to adjust 'silence_threshold' by observing RMS levels in console
silence_threshold = 500
log_rms = false
